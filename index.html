<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scialla Radio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <section class="player">

            <div class="logo">
                <img src="logo.png" alt="Scialla Radio">
            </div>

            <button class="play-button" aria-label="Play"></button>

            <div class="track">
                <h2>Live Radio</h2>
                <p>Broadcasting from the Mediterranean</p>
            </div>

        </section>

        <footer>

            <div class="socials">
                <a href="#" target="_blank">Instagram</a>
                <a href="#" target="_blank">SoundCloud</a>
                <a href="mailto:hello@scialla.radio">Mail</a>
            </div>

            <p>Created and curated by Scialla Radio</p>

        </footer>

    </main>

</body>
</html>
