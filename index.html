<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scialla Radio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

       <section class="player">

    <div class="logo">
        <img src="logo.png" alt="Scialla Radio">
    </div>

    <button class="play-button" id="playButton" aria-label="Play"></button>

    <audio id="radioPlayer">
        <source src="https://play.radioking.io/scialla-radio" type="audio/mpeg">
    </audio>

    <div class="track">
        <h2>Live Radio</h2>
        <p>Broadcasting from somewhere under the sun</p>
    </div>

</section>

                </footer>

    </main>

    <script>
    const playButton = document.getElementById("playButton");
    const radioPlayer = document.getElementById("radioPlayer");

    playButton.addEventListener("click", () => {
        if (radioPlayer.paused) {
            radioPlayer.play();
            playButton.classList.add("is-playing");
        } else {
            radioPlayer.pause();
            playButton.classList.remove("is-playing");
        }
    });
    </script>

</body>
</html>
