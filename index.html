<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scialla Radio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <section class="player">

            <div class="logo">
                <img src="logo.png" alt="Scialla Radio">
            </div>

            <button class="play-button" id="playButton" aria-label="Play"></button>

            <audio id="radioPlayer">
                <source src="https://play.radioking.io/scialla-radio" type="audio/mpeg">
            </audio>

            <div class="track">
    <h2 id="trackTitle">Loading...</h2>
    <p id="trackArtist">Please wait...</p>
</div>

        </section>

    </main>

    <script>
const playButton = document.getElementById("playButton");
const radioPlayer = document.getElementById("radioPlayer");

playButton.addEventListener("click", () => {
    if (radioPlayer.paused) {
        radioPlayer.play();
        playButton.classList.add("is-playing");
    } else {
        radioPlayer.pause();
        playButton.classList.remove("is-playing");
    }
});

async function updateTrackInfo() {

    try {

        const response = await fetch(
            "https://api.radioking.io/widget/radio/scialla-radio/track/current"
        );

        const data = await response.json();

        document.getElementById("trackTitle").textContent =
            data.title || "Scialla Radio";

        document.getElementById("trackArtist").textContent =
            data.artist || "";

    } catch (error) {

        document.getElementById("trackTitle").textContent = "Scialla Radio";
        document.getElementById("trackArtist").textContent = "";

    }

}

updateTrackInfo();

setInterval(updateTrackInfo, 10000);
</script>

</body>
</html>
